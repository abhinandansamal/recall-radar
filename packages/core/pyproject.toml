[project]
name = "rr-core"
version = "0.1.0"
description = "Shared building blocks: settings, JSON logging, correlation IDs, errors."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
