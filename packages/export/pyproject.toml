[project]
name = "rr-export"
version = "0.1.0"
description = "Loads gold exports from the lake into the Postgres knowledge base (staging + atomic swap)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "rr-core",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
