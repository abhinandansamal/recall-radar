# Runs on every `git commit` (install once with `uv run pre-commit install`).
# CI runs the same hooks, so "works on my machine" and "works in CI" mean the same thing.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files   # data never goes into git
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch       # never commit directly to main
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # mypy runs through uv (not a pre-commit mirror) so it sees the real installed packages.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy packages/core/src
        language: system
        types: [python]
        pass_filenames: false
